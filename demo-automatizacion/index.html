<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo asistente de citas por WhatsApp</title><meta name="description" content="Demo de asistente de citas por WhatsApp para una peluquería: confirma, recuerda y reprograma citas. Datos ficticios.">
<style>
:root{--bg:#ece5dd;--me:#d9fdd3;--bot:#fff;--ink:#111;--hd:#075e54}
@media(prefers-color-scheme:dark){:root{--bg:#0b141a;--me:#005c4b;--bot:#202c33;--ink:#e9edef;--hd:#202c33}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:480px;height:100vh;display:flex;flex-direction:column}
header{background:var(--hd);color:#fff;padding:12px 16px}header small{display:block;opacity:.8}

form{display:flex;gap:6px;padding:8px 12px}input{flex:1;padding:10px;border-radius:20px;border:1px solid #888;background:var(--bot);color:var(--ink)}

</style><style id="tema-sector">
/* PELUQUERÍA: elegante, marfil y oro viejo */

form button{background:#7a5c24;color:#fff;border-radius:999px;letter-spacing:.08em}
input{border-color:#c9a46b;font-family:inherit}
</style><style id="identidad-sector">
/* PELUQUERÍA: elegante, marfil y oro viejo */
:root{--bg:#f6efe9;--me:#ecd5c8;--bot:#fffaf5;--ink:#2b2220;--hd:#3b2a2a}
@media(prefers-color-scheme:dark){:root{--bg:#1d1615;--me:#5a3f38;--bot:#2a201f;--ink:#f3e8de;--hd:#120d0d}}
body{background:radial-gradient(500px 400px at 100% 0,#d9b98a33,transparent 70%),var(--bg);font-family:Georgia,"Times New Roman",serif}
header{background:var(--hd);border-bottom:2px solid #c9a46b;text-align:center;letter-spacing:.04em}header b{font-style:italic;font-size:1.25rem;letter-spacing:.14em;text-transform:uppercase;color:#f1e1c4}

.m{border-radius:18px 18px 18px 4px;border:1px solid #c9a46b55}.m.me{border-radius:18px 18px 4px 18px}
.q button{border:1px solid #8a6a2f;border-radius:999px;font-family:inherit;letter-spacing:.04em;color:inherit}

input{border-color:#c9a46b;font-family:inherit}
.app{border-inline:1px solid #c9a46b55;background:linear-gradient(180deg,transparent,#d9b98a14)}#log{background:repeating-linear-gradient(45deg,#c9a46b0a 0 2px,transparent 2px 16px)}
.q{justify-content:center}.q button{padding:7px 16px}.note{font-style:italic}
</style></head><body><div class="app">
<header><b>Peluquería Ejemplo</b><small>Asistente automático · responde 24 h</small><p style="font-size:11px;opacity:.7;margin:4px 0 0">Demo ficticia · <a href="/aviso-legal.html" target="_top">Aviso legal</a> · <a href="/privacidad.html" target="_top">Privacidad</a> · <a href="/cookies.html" target="_top">Cookies</a></p></header>
<div id="log"></div>
<div class="q" id="q"></div>
<form id="f"><input id="i" placeholder="Escribe un mensaje" autocomplete="off"><button>Enviar</button></form>
<div class="note">Demo ficticia: así atendería tu negocio las citas por WhatsApp, también de madrugada.</div>
</div>
<script>
const log=document.getElementById('log'),q=document.getElementById('q');
const slots=['10:00','11:30','16:00','18:30'];let st={};
function add(t,me){const d=document.createElement('div');d.className='m'+(me?' me':'');d.textContent=t;log.appendChild(d);log.scrollTop=1e9}
function opts(a){q.innerHTML='';a.forEach(x=>{const b=document.createElement('button');b.textContent=x;b.onclick=()=>say(x);q.appendChild(b)})}
function bot(t,o){setTimeout(()=>{add(t);opts(o||['Pedir cita','Precios','Horario'])},400)}
function say(t){add(t,true);const s=t.toLowerCase();
 if(st.step==='hora'&&slots.includes(t)){st.hora=t;st.step='nombre';return bot('Perfecto, '+st.dia+' a las '+t+'. ¿A nombre de quién?',[])}
 if(st.step==='nombre'){const n=t;st={};return bot('Cita confirmada para '+n+'. Te llegará un recordatorio el día antes. Si necesitas cambiarla, escríbeme aquí.\n(El dueño recibe el aviso en su móvil.)')}
 if(/cita|reserv|hora/.test(s)){st={step:'dia'};return bot('¡Claro! ¿Para qué día?',['Mañana','Viernes','Sábado'])}
 if(st.step==='dia'){st.dia=t;st.step='hora';return bot('Para '+t+' tengo libre:',slots)}
 if(/precio|cuesta|tarifa/.test(s))return bot('Corte mujer 22 €\nCorte hombre 12 €\nTinte desde 35 €\nBarba 8 €');
 if(/horario|abr|cierr/.test(s))return bot('Lunes a sábado de 9:30 a 20:00. Domingo cerrado.');
 bot('Puedo ayudarte con citas, precios y horario. Si es otra cosa, aviso al equipo y te contestan en cuanto abran.')}
document.getElementById('f').onsubmit=e=>{e.preventDefault();const v=i.value.trim();if(v){i.value='';say(v)}};
bot('¡Hola! Soy el asistente de Peluquería Ejemplo. ¿En qué te ayudo?');
</script></body></html>
